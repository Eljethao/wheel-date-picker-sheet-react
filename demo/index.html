<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>wheel-date-picker-sheet demo</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;600;700&display=block" />
    <link rel="stylesheet" href="./build/main.css" />
    <style>
      body {
        margin: 0;
        background: #f3f4f6;
        color: #111827;
        font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans Lao", sans-serif;
      }
      .demo {
        max-width: 420px;
        margin: 0 auto;
        padding: 28px 20px;
        display: flex;
        flex-direction: column;
        gap: 18px;
      }
      .demo h1 {
        margin: 0 0 4px;
        font-size: 24px;
      }
      .demo label {
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-size: 14px;
        font-weight: 600;
      }
      .demo input,
      .demo label > button {
        height: 48px;
        padding: 0 14px;
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        background: #fff;
        font: inherit;
        font-size: 16px;
        font-weight: 400;
        text-align: left;
        color: inherit;
      }
      .muted {
        color: #9ca3af;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="./build/main.js"></script>
  </body>
</html>
